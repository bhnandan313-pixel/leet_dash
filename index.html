<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEETCODE // LEAGUE</title>
<style>
:root{--ink:#080a0f;--surface:#0f131a;--elevated:#161c26;--hover:#1d2533;--border:#232c3d;--muted:#64748b;--text:#e2e8f0;--easy:#10b981;--medium:#f59e0b;--hard:#ef4444;--gold:#eab308}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background-color:var(--ink);background-image:linear-gradient(rgba(35,44,61,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(35,44,61,.22) 1px,transparent 1px);background-size:24px 24px;color:var(--text);font:14px 'JetBrains Mono',monospace}.shell{max-width:1152px;margin:auto;padding:24px 16px 48px}
<header class="header"><div><div class="brand"><span class="brand-dot"></span><h1>LEETCODE <span class="slash">//</span> LEAGUE</h1></div><p class="subtitle">A daily snapshot of the problems we solve.</p></div><div class="status"><span class="live"></span><span>UPDATED: <strong id="updated">syncing...</strong></span><button class="icon-btn" id="refresh" aria-label="Refresh leaderboard" title="Refresh leaderboard">&#8635;</button></div></header>
<section class="metrics" aria-label="Summary metrics"><article class="metric"><div class="metric-label">Competitors <span>◉</span></div><div class="metric-value" id="competitors">0</div><div class="metric-note">active trackers</div></article><article class="metric"><div class="metric-label">Total solved <span class="easy">✓</span></div><div class="metric-value" id="solved">0</div><div class="metric-note"><span class="easy" id="easy-total">0E</span> · <span class="medium" id="medium-total">0M</span> · <span class="hard" id="hard-total">0H</span></div></article><article class="metric"><div class="metric-label">Current leader <span class="medium">◆</span></div><div class="metric-value" id="leader">--</div><div class="metric-note" id="leader-score">0 solved overall</div></article><article class="metric"><div class="metric-label">Highest streak <span class="streak">▲</span></div><div class="metric-value" id="streak">0 days</div><div class="metric-note" id="streak-holder">Held by: --</div></article></section>
<section class="controls"><input class="search" id="search" type="search" placeholder="Filter by player username or name..." aria-label="Filter players"><div class="sorts"><button class="sort active" data-sort="total">Solved ↓</button><button class="sort" data-sort="streak">Streak</button><button class="sort" data-sort="name">Name</button></div></section>
<section class="panel" style="padding:0;overflow:hidden"><div class="table-head"><span>Rank</span><span>Player</span><span>Total solved</span><span>Easy</span><span>Med</span><span>Hard</span><span>Streak</span><span></span></div><div id="rows"></div><div class="empty" id="empty" hidden>No competitors match this filter.</div></section>
<section class="panel"><div class="panel-head"><div><h2>Problems solved over time</h2><p>Cumulative progress from the daily backend snapshots</p></div><div class="legend" id="legend"></div></div><svg id="chart" viewBox="0 0 900 250" role="img" aria-label="Problems solved over time chart"></svg><div class="empty" id="chart-empty" hidden>No historical snapshots found yet.</div></section>
<footer class="footer"><span>Endpoint: data/leaderboard.json</span><span>LIVE CLIENT FEED</span></footer>
</main>
<script>
const state={users:[],query:'',sort:'total',order:'desc',expanded:new Set()};
const palette=['#f59e0b','#38bdf8','#10b981','#a855f7','#f43f5e','#34d399','#fb923c'];
const $=id=>document.getElementById(id);
function formatDate(value){const date=new Date(value);return Number.isNaN(date.getTime())?value:date.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function animate(id,value){const el=$(id), end=Number(value)||0; if(!el)return; el.textContent=end.toLocaleString();}
function updateMetrics(){let solved=0,easy=0,medium=0,hard=0,leader=state.users[0],maxStreak=0,holder='--';state.users.forEach(u=>{const c=u.current||{};solved+=c.total_solved||0;easy+=c.easy||0;medium+=c.medium||0;hard+=c.hard||0;if((c.streak||0)>maxStreak){maxStreak=c.streak;holder=u.display_name;}});animate('competitors',state.users.length);animate('solved',solved);$('easy-total').textContent=easy+'E';$('medium-total').textContent=medium+'M';$('hard-total').textContent=hard+'H';$('leader').textContent=leader?.display_name||'--';$('leader-score').textContent=(leader?.current?.total_solved||0)+' solved overall';$('streak').textContent=maxStreak+' days';$('streak-holder').textContent='Held by: '+holder;}
function visibleUsers(){const q=state.query.toLowerCase().trim();return state.users.filter(u=>!q||u.username.toLowerCase().includes(q)||u.display_name.toLowerCase().includes(q)).sort((a,b)=>{let x,y;if(state.sort==='name'){x=a.display_name.toLowerCase();y=b.display_name.toLowerCase();}else{x=a.current?.[state.sort==='total'?'total_solved':'streak']||0;y=b.current?.[state.sort==='total'?'total_solved':'streak']||0;}return x<y?(state.order==='asc'?-1:1):x>y?(state.order==='asc'?1:-1):0;});}
function renderRows(){const list=visibleUsers(), container=$('rows');container.innerHTML='';$('empty').hidden=list.length>0;list.forEach((u,index)=>{const c=u.current||{}, first=index===0&&state.sort==='total'&&state.order==='desc', expanded=state.expanded.has(u.username), row=document.createElement('article');row.className='row'+(first?' first':'')+(expanded?' expanded':'');row.innerHTML=`<div class="row-main"><div class="rank">${first?'◆':'#'+(index+1)}</div><div><div class="player-name">${escapeHtml(u.display_name)}</div><div class="username">@${escapeHtml(u.username)}</div></div><div class="total">${c.total_solved||0}</div><div class="stat easy">${c.easy||0}</div><div class="stat medium">${c.medium||0}</div><div class="stat hard">${c.hard||0}</div><div class="streak">▲ ${c.streak||0}</div><div class="chevron">⌄</div></div><div class="details"><div><div class="detail-title">Dominant algorithm topics</div><div class="tags">${(c.top_tags||[]).map(t=>`<span class="tag"><b>${t.solved}</b> ${escapeHtml(t.tag)}</span>`).join('')||'<span class="tag">No tag metadata</span>'}</div></div><div class="history"><div class="detail-title">Timeline milestones</div>${Object.entries(u.history||{}).map(([date,count])=>`<div class="history-line"><span>${date}</span><strong>${count}</strong></div>`).join('')||'<div class="history-line">No snapshots</div>'}</div></div>`;row.addEventListener('click',()=>{state.expanded.has(u.username)?state.expanded.delete(u.username):state.expanded.add(u.username);renderRows();});container.appendChild(row);});}
function renderChart(){const svg=$('chart'), dates=[...new Set(state.users.flatMap(u=>Object.keys(u.history||{})))].sort();if(dates.length<2||!state.users.length){svg.hidden=true;$('chart-empty').hidden=false;$('legend').innerHTML='';return;}svg.hidden=false;$('chart-empty').hidden=true;const max=Math.max(1,...state.users.flatMap(u=>Object.values(u.history||{}))), left=48,right=18,top=18,bottom=32,w=900,h=250,innerW=w-left-right,innerH=h-top-bottom;svg.innerHTML='';for(let i=0;i<=4;i++){const y=top+innerH*i/4,line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',left);line.setAttribute('x2',w-right);line.setAttribute('y1',y);line.setAttribute('y2',y);line.setAttribute('stroke','#232c3d');line.setAttribute('stroke-dasharray','3 3');svg.appendChild(line);}$('legend').innerHTML='';state.users.slice(0,7).forEach((u,idx)=>{const color=palette[idx%palette.length], pill=document.createElement('span');pill.innerHTML=`<i style="background:${color}"></i>${escapeHtml(u.display_name)}`;$('legend').appendChild(pill);const points=dates.map((date,i)=>{const value=u.history?.[date];return value==null?null:[left+innerW*(dates.length<2?0:i/(dates.length-1)),top+innerH*(1-value/max)];}).filter(Boolean);if(points.length<2)return;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',points.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' '));path.setAttribute('fill','none');path.setAttribute('stroke',color);path.setAttribute('stroke-width','3');path.setAttribute('stroke-linecap','round');path.setAttribute('class','chart-path');svg.appendChild(path);points.forEach(p=>{const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');circle.setAttribute('cx',p[0]);circle.setAttribute('cy',p[1]);circle.setAttribute('r','4');circle.setAttribute('fill',color);svg.appendChild(circle);});});}
function escapeHtml(value){const div=document.createElement('div');div.textContent=value??'';return div.innerHTML;}
async function load(){try{const response=await fetch('data/leaderboard.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();state.users=Object.entries(data.users||{}).map(([username,user])=>({username,display_name:user.display_name||username,current:user.current||{},history:user.history||{}}));$('updated').textContent=formatDate(data.last_updated);$('rows').innerHTML='';$('empty').hidden=true;updateMetrics();renderRows();renderChart();}catch(error){$('rows').innerHTML=`<div class="error">Could not load data/leaderboard.json: ${escapeHtml(error.message)}</div>`;$('empty').hidden=true;}}
$('search').addEventListener('input',e=>{state.query=e.target.value;renderRows();});document.querySelectorAll('[data-sort]').forEach(button=>button.addEventListener('click',()=>{const sort=button.dataset.sort;if(state.sort===sort)state.order=state.order==='asc'?'desc':'asc';else{state.sort=sort;state.order=sort==='name'?'asc':'desc';}document.querySelectorAll('.sort').forEach(item=>item.classList.toggle('active',item===button));button.textContent=(sort==='total'?'Solved':sort[0].toUpperCase()+sort.slice(1))+' '+(state.order==='asc'?'↑':'↓');renderRows();}));$('refresh').addEventListener('click',load);window.addEventListener('resize',renderChart);load();
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #10131c;
    --panel: #171c29;
    --panel-line: #262d3d;
    --text: #e7e9f0;
    --text-dim: #8992a8;
    --easy: #7fc45c;
    --medium: #e8a33d;
    --hard: #e05d5d;
    --gold: #d8b45c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    padding: 32px 20px 80px;
  }
  h1, h2 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
  .wrap { max-width: 920px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  header h1 { font-size: 28px; font-weight: 700; }
  header p { color: var(--text-dim); margin: 6px 0 0; font-size: 14px; }

  .rank-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 36px; }
  .rank-row {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 32px 1fr auto auto;
    align-items: center;
    gap: 14px;
    cursor: pointer;
  }
  .rank-row.gold { border-color: var(--gold); }
  .rank-num { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; color: var(--text-dim); }
  .rank-row.gold .rank-num { color: var(--gold); }
  .rank-name { font-size: 15px; }
  .rank-name .streak { color: var(--text-dim); font-size: 12px; display: block; margin-top: 2px; }
  .rank-total { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; text-align: right; }
  .rank-split { display: flex; gap: 6px; font-size: 11px; }
  .chip { padding: 2px 7px; border-radius: 5px; }
  .chip.easy { background: rgba(127,196,92,0.15); color: var(--easy); }
  .chip.medium { background: rgba(232,163,61,0.15); color: var(--medium); }
  .chip.hard { background: rgba(224,93,93,0.15); color: var(--hard); }

  .detail {
    display: none;
    grid-column: 1 / -1;
    border-top: 1px solid var(--panel-line);
    margin-top: 10px;
    padding-top: 14px;
  }
  .detail.open { display: block; }
  .detail h3 { font-size: 12px; color: var(--text-dim); font-weight: 500; margin: 0 0 8px; text-transform: none; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .tag { font-size: 11px; background: #1f2536; border: 1px solid var(--panel-line); padding: 3px 9px; border-radius: 12px; color: var(--text-dim); }
  .tag b { color: var(--text); }

  .chart-panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 20px;
  }
  .chart-panel h2 { font-size: 16px; margin-bottom: 14px; }
  .empty, .error { color: var(--text-dim); font-size: 14px; padding: 40px 0; text-align: center; }
  .error { color: var(--hard); }
  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Leaderboard</h1>
    <p id="updated-line">Loading&hellip;</p>
  </header>

  <div id="rank-list" class="rank-list"></div>

  <div class="chart-panel">
    <h2>Problems solved over time</h2>
    <canvas id="trend-chart" height="110"></canvas>
  </div>

  <footer>Data refreshes automatically once a day.</footer>
</div>

<script>
const DIFF_COLORS = { easy: '#7fc45c', medium: '#e8a33d', hard: '#e05d5d' };

async function loadBoard() {
  const rankList = document.getElementById('rank-list');
  const updatedLine = document.getElementById('updated-line');
  try {
    const res = await fetch('data/leaderboard.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('no data file yet');
    const board = await res.json();
    const users = Object.entries(board.users || {}).map(([username, u]) => ({ username, ...u }));

    if (users.length === 0) {
      rankList.innerHTML = '<div class="empty">No data yet — the daily fetch hasn\'t run. Trigger the "Update LeetCode leaderboard" workflow manually to seed it.</div>';
      updatedLine.textContent = '';
      return;
    }

    users.sort((a, b) => (b.current?.total_solved || 0) - (a.current?.total_solved || 0));

    updatedLine.textContent = board.last_updated
      ? `Last updated ${new Date(board.last_updated).toLocaleString()}`
      : '';

    renderRankList(rankList, users);
    renderTrendChart(users);
  } catch (err) {
    rankList.innerHTML = `<div class="error">Couldn't load leaderboard data (${err.message}). Make sure data/leaderboard.json exists — run the fetch script once locally or trigger the GitHub Action.</div>`;
    updatedLine.textContent = '';
  }
}

function renderRankList(container, users) {
  container.innerHTML = '';
  users.forEach((u, i) => {
    const c = u.current || {};
    const row = document.createElement('div');
    row.className = 'rank-row' + (i === 0 ? ' gold' : '');
    row.innerHTML = `
      <div class="rank-num">${i + 1}</div>
      <div class="rank-name">
        ${escapeHtml(u.display_name)}
        <span class="streak">${c.streak ? c.streak + '-day streak' : 'no active streak'}</span>
      </div>
      <div class="rank-split">
        <span class="chip easy">${c.easy ?? 0}E</span>
        <span class="chip medium">${c.medium ?? 0}M</span>
        <span class="chip hard">${c.hard ?? 0}H</span>
      </div>
      <div class="rank-total">${c.total_solved ?? 0}</div>
      <div class="detail">
        <h3>Top topics</h3>
        <div class="tag-list">
          ${(c.top_tags || []).map(t => `<span class="tag"><b>${t.solved}</b> ${escapeHtml(t.tag)}</span>`).join('') || '<span class="tag">no tag data</span>'}
        </div>
      </div>
    `;
    row.addEventListener('click', () => {
      row.querySelector('.detail').classList.toggle('open');
    });
    container.appendChild(row);
  });
}

function renderTrendChart(users) {
  if (typeof Chart === 'undefined') {
    renderNativeTrendChart(users);
    return;
  }

  const allDates = new Set();
  users.forEach(u => Object.keys(u.history || {}).forEach(d => allDates.add(d)));
  const dates = Array.from(allDates).sort();

  const palette = ['#7fc45c', '#e8a33d', '#e05d5d', '#6ea8e0', '#d8b45c', '#c07fe0', '#5cd6c0', '#e07fb0'];

  const datasets = users.map((u, i) => ({
    label: u.display_name,
    data: dates.map(d => u.history?.[d] ?? null),
    borderColor: palette[i % palette.length],
    backgroundColor: 'transparent',
    spanGaps: true,
    tension: 0.25,
    pointRadius: 2,
  }));

  new Chart(document.getElementById('trend-chart'), {
    type: 'line',
    data: { labels: dates, datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#8992a8', font: { family: 'IBM Plex Mono', size: 11 } } },
      },
      scales: {
        x: { ticks: { color: '#8992a8' }, grid: { color: '#262d3d' } },
        y: { ticks: { color: '#8992a8' }, grid: { color: '#262d3d' }, beginAtZero: true },
      },
    },
  });
}

function renderNativeTrendChart(users) {
  const canvas = document.getElementById('trend-chart');
  const context = canvas.getContext('2d');
  const dates = Array.from(new Set(users.flatMap(u => Object.keys(u.history || {})))).sort();
  const palette = ['#7fc45c', '#e8a33d', '#e05d5d', '#6ea8e0', '#d8b45c', '#c07fe0', '#5cd6c0', '#e07fb0'];
  const width = canvas.clientWidth || 600;
  const height = 220;
  const padding = { top: 18, right: 18, bottom: 34, left: 42 };
  const maxValue = Math.max(1, ...users.flatMap(u => Object.values(u.history || {})));
  const x = index => padding.left + (dates.length < 2 ? 0 : index * (width - padding.left - padding.right) / (dates.length - 1));
  const y = value => height - padding.bottom - value * (height - padding.top - padding.bottom) / maxValue;

  canvas.width = width * devicePixelRatio;
  canvas.height = height * devicePixelRatio;
  canvas.style.height = `${height}px`;
  context.scale(devicePixelRatio, devicePixelRatio);
  context.clearRect(0, 0, width, height);
  context.font = '11px IBM Plex Mono';
  context.strokeStyle = '#262d3d';
  context.fillStyle = '#8992a8';
  context.lineWidth = 1;
  context.beginPath();
  context.moveTo(padding.left, padding.top);
  context.lineTo(padding.left, height - padding.bottom);
  context.lineTo(width - padding.right, height - padding.bottom);
  context.stroke();
  context.fillText(String(maxValue), 8, padding.top + 4);
  context.fillText('0', 28, height - padding.bottom + 4);
  if (dates.length) {
    context.fillText(dates[0], padding.left, height - 10);
    context.fillText(dates[dates.length - 1], Math.max(padding.left, width - padding.right - 72), height - 10);
  }

  users.forEach((user, userIndex) => {
    const points = dates.map((date, index) => [x(index), y(user.history?.[date] ?? 0)]);
    context.strokeStyle = palette[userIndex % palette.length];
    context.fillStyle = palette[userIndex % palette.length];
    context.beginPath();
    points.forEach(([pointX, pointY], index) => index ? context.lineTo(pointX, pointY) : context.moveTo(pointX, pointY));
    context.stroke();
    points.forEach(([pointX, pointY]) => { context.beginPath(); context.arc(pointX, pointY, 3, 0, Math.PI * 2); context.fill(); });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

loadBoard();
</script>
</body>
</html>
