<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #10131c;
    --panel: #171c29;
    --panel-line: #262d3d;
    --text: #e7e9f0;
    --text-dim: #8992a8;
    --easy: #7fc45c;
    --medium: #e8a33d;
    --hard: #e05d5d;
    --gold: #d8b45c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    padding: 32px 20px 80px;
  }
  h1, h2 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
  .wrap { max-width: 920px; margin: 0 auto; }

  header { margin-bottom: 28px; }
  header h1 { font-size: 28px; font-weight: 700; }
  header p { color: var(--text-dim); margin: 6px 0 0; font-size: 14px; }

  .rank-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 36px; }
  .rank-row {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 32px 1fr auto auto;
    align-items: center;
    gap: 14px;
    cursor: pointer;
  }
  .rank-row.gold { border-color: var(--gold); }
  .rank-num { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; color: var(--text-dim); }
  .rank-row.gold .rank-num { color: var(--gold); }
  .rank-name { font-size: 15px; }
  .rank-name .streak { color: var(--text-dim); font-size: 12px; display: block; margin-top: 2px; }
  .rank-total { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; text-align: right; }
  .rank-split { display: flex; gap: 6px; font-size: 11px; }
  .chip { padding: 2px 7px; border-radius: 5px; }
  .chip.easy { background: rgba(127,196,92,0.15); color: var(--easy); }
  .chip.medium { background: rgba(232,163,61,0.15); color: var(--medium); }
  .chip.hard { background: rgba(224,93,93,0.15); color: var(--hard); }

  .detail {
    display: none;
    grid-column: 1 / -1;
    border-top: 1px solid var(--panel-line);
    margin-top: 10px;
    padding-top: 14px;
  }
  .detail.open { display: block; }
  .detail h3 { font-size: 12px; color: var(--text-dim); font-weight: 500; margin: 0 0 8px; text-transform: none; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .tag { font-size: 11px; background: #1f2536; border: 1px solid var(--panel-line); padding: 3px 9px; border-radius: 12px; color: var(--text-dim); }
  .tag b { color: var(--text); }

  .chart-panel {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 20px;
  }
  .chart-panel h2 { font-size: 16px; margin-bottom: 14px; }
  .empty, .error { color: var(--text-dim); font-size: 14px; padding: 40px 0; text-align: center; }
  .error { color: var(--hard); }
  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Leaderboard</h1>
    <p id="updated-line">Loading&hellip;</p>
  </header>

  <div id="rank-list" class="rank-list"></div>

  <div class="chart-panel">
    <h2>Problems solved over time</h2>
    <canvas id="trend-chart" height="110"></canvas>
  </div>

  <footer>Data refreshes automatically once a day.</footer>
</div>

<script>
const DIFF_COLORS = { easy: '#7fc45c', medium: '#e8a33d', hard: '#e05d5d' };

async function loadBoard() {
  const rankList = document.getElementById('rank-list');
  const updatedLine = document.getElementById('updated-line');
  try {
    const res = await fetch('data/leaderboard.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('no data file yet');
    const board = await res.json();
    const users = Object.entries(board.users || {}).map(([username, u]) => ({ username, ...u }));

    if (users.length === 0) {
      rankList.innerHTML = '<div class="empty">No data yet — the daily fetch hasn\'t run. Trigger the "Update LeetCode leaderboard" workflow manually to seed it.</div>';
      updatedLine.textContent = '';
      return;
    }

    users.sort((a, b) => (b.current?.total_solved || 0) - (a.current?.total_solved || 0));

    updatedLine.textContent = board.last_updated
      ? `Last updated ${new Date(board.last_updated).toLocaleString()}`
      : '';

    renderRankList(rankList, users);
    renderTrendChart(users);
  } catch (err) {
    rankList.innerHTML = `<div class="error">Couldn't load leaderboard data (${err.message}). Make sure data/leaderboard.json exists — run the fetch script once locally or trigger the GitHub Action.</div>`;
    updatedLine.textContent = '';
  }
}

function renderRankList(container, users) {
  container.innerHTML = '';
  users.forEach((u, i) => {
    const c = u.current || {};
    const row = document.createElement('div');
    row.className = 'rank-row' + (i === 0 ? ' gold' : '');
    row.innerHTML = `
      <div class="rank-num">${i + 1}</div>
      <div class="rank-name">
        ${escapeHtml(u.display_name)}
        <span class="streak">${c.streak ? c.streak + '-day streak' : 'no active streak'}</span>
      </div>
      <div class="rank-split">
        <span class="chip easy">${c.easy ?? 0}E</span>
        <span class="chip medium">${c.medium ?? 0}M</span>
        <span class="chip hard">${c.hard ?? 0}H</span>
      </div>
      <div class="rank-total">${c.total_solved ?? 0}</div>
      <div class="detail">
        <h3>Top topics</h3>
        <div class="tag-list">
          ${(c.top_tags || []).map(t => `<span class="tag"><b>${t.solved}</b> ${escapeHtml(t.tag)}</span>`).join('') || '<span class="tag">no tag data</span>'}
        </div>
      </div>
    `;
    row.addEventListener('click', () => {
      row.querySelector('.detail').classList.toggle('open');
    });
    container.appendChild(row);
  });
}

function renderTrendChart(users) {
  if (typeof Chart === 'undefined') {
    renderNativeTrendChart(users);
    return;
  }

  const allDates = new Set();
  users.forEach(u => Object.keys(u.history || {}).forEach(d => allDates.add(d)));
  const dates = Array.from(allDates).sort();

  const palette = ['#7fc45c', '#e8a33d', '#e05d5d', '#6ea8e0', '#d8b45c', '#c07fe0', '#5cd6c0', '#e07fb0'];

  const datasets = users.map((u, i) => ({
    label: u.display_name,
    data: dates.map(d => u.history?.[d] ?? null),
    borderColor: palette[i % palette.length],
    backgroundColor: 'transparent',
    spanGaps: true,
    tension: 0.25,
    pointRadius: 2,
  }));

  new Chart(document.getElementById('trend-chart'), {
    type: 'line',
    data: { labels: dates, datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#8992a8', font: { family: 'IBM Plex Mono', size: 11 } } },
      },
      scales: {
        x: { ticks: { color: '#8992a8' }, grid: { color: '#262d3d' } },
        y: { ticks: { color: '#8992a8' }, grid: { color: '#262d3d' }, beginAtZero: true },
      },
    },
  });
}

function renderNativeTrendChart(users) {
  const canvas = document.getElementById('trend-chart');
  const context = canvas.getContext('2d');
  const dates = Array.from(new Set(users.flatMap(u => Object.keys(u.history || {})))).sort();
  const palette = ['#7fc45c', '#e8a33d', '#e05d5d', '#6ea8e0', '#d8b45c', '#c07fe0', '#5cd6c0', '#e07fb0'];
  const width = canvas.clientWidth || 600;
  const height = 220;
  const padding = { top: 18, right: 18, bottom: 34, left: 42 };
  const maxValue = Math.max(1, ...users.flatMap(u => Object.values(u.history || {})));
  const x = index => padding.left + (dates.length < 2 ? 0 : index * (width - padding.left - padding.right) / (dates.length - 1));
  const y = value => height - padding.bottom - value * (height - padding.top - padding.bottom) / maxValue;

  canvas.width = width * devicePixelRatio;
  canvas.height = height * devicePixelRatio;
  canvas.style.height = `${height}px`;
  context.scale(devicePixelRatio, devicePixelRatio);
  context.clearRect(0, 0, width, height);
  context.font = '11px IBM Plex Mono';
  context.strokeStyle = '#262d3d';
  context.fillStyle = '#8992a8';
  context.lineWidth = 1;
  context.beginPath();
  context.moveTo(padding.left, padding.top);
  context.lineTo(padding.left, height - padding.bottom);
  context.lineTo(width - padding.right, height - padding.bottom);
  context.stroke();
  context.fillText(String(maxValue), 8, padding.top + 4);
  context.fillText('0', 28, height - padding.bottom + 4);
  if (dates.length) {
    context.fillText(dates[0], padding.left, height - 10);
    context.fillText(dates[dates.length - 1], Math.max(padding.left, width - padding.right - 72), height - 10);
  }

  users.forEach((user, userIndex) => {
    const points = dates.map((date, index) => [x(index), y(user.history?.[date] ?? 0)]);
    context.strokeStyle = palette[userIndex % palette.length];
    context.fillStyle = palette[userIndex % palette.length];
    context.beginPath();
    points.forEach(([pointX, pointY], index) => index ? context.lineTo(pointX, pointY) : context.moveTo(pointX, pointY));
    context.stroke();
    points.forEach(([pointX, pointY]) => { context.beginPath(); context.arc(pointX, pointY, 3, 0, Math.PI * 2); context.fill(); });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

loadBoard();
</script>
</body>
</html>
