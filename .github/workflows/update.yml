name: Update LeetCode leaderboard

on:
  schedule:
    # 00:30 UTC daily = 6:00 AM IST
    - cron: "30 0 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest stats
        run: python fetch_leetcode.py

      - name: Commit updated data
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "actions@github.com"
          git add data/leaderboard.json
          git diff --cached --quiet || git commit -m "Update leaderboard data"
          git push
